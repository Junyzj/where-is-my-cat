<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Is My Cat?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>🐱 Where Is My Cat?</h1>
        <p>Miso is missing! You just got home, but you cannot find your cat.</p>
        <h2>Where do you want to look?</h2>

        <div class="choices">
            <button id="kitchen-btn" onclick="explore('kitchen')">🍞 Kitchen</button>
            <button id="garden-btn" onclick="explore('garden')">🌿 Garden</button>
            <button id="bedroom-btn" onclick="explore('bedroom')">🛏️ Bedroom</button>
        </div>

        <section class="result" aria-live="polite">
            <img id="scene-image" src="images/cover-cat.jpg" alt="Orange cat" class="scene-image">
            <div id="scene-icon" class="scene-icon">🐾</div>
            <h2 id="result-title">Start Your Search</h2>
            <p id="result-text">Click a room to see what happens.</p>
        </section>

        <p class="progress">
            Searches: <span id="search-count">0</span> |
            Clues: <span id="clue-count">0</span>/2
        </p>

        <button class="restart" onclick="restartStory()">Start Again</button>

        <p class="footer">CCT360 · An Interactive Cat Story</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
